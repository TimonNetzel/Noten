[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noten"
version = "0.1.0"
description = "Hierarchisches Bayes-Modell zur Zeugnisnote (nur simulierte Daten)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pymc>=5.16",
    "arviz>=0.18",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "nutpie>=0.13",  # schneller NUTS-Sampler; Fallback auf pm.sample, falls nicht installiert
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: Fit-Smoketests mit MCMC (einige Sekunden bis Minuten)"]
filterwarnings = ["ignore:PyTensor could not link to a BLAS:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["E741"]
